name: Release

# Релиз собирается при пуше тега вида v0.1.0.
# Тег создаётся вручную: git tag -a v0.1.0 -m "..." && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история и теги нужны, чтобы git describe в Makefile
          # подставил версию через -ldflags.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: make test

      - name: build
        run: make build

      - name: version
        id: version
        run: |
          # v0.1.0 -> 0.1.0: deb и rpm не допускают ведущую 'v' в версии.
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: verify binary
        run: |
          ./bin/senso version
          ./bin/senso version | grep -q "${GITHUB_REF_NAME}"

      - name: archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          tar -czf "dist/senso_${VERSION}_linux_${ARCH}.tar.gz" \
            -C bin senso \
            -C .. README.md LICENSE docs

      - name: install nfpm
        env:
          NFPM_VERSION: 2.47.0
          # x86_64/arm64 - имена ассетов в релизах nfpm.
          NFPM_ARCH: ${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}
        run: |
          # Готовый бинарник вместо go install: nfpm требует более свежий Go,
          # чем указан в go.mod, а setup-go выставляет GOTOOLCHAIN=local.
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          curl -fsSL "$url" | tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: packages
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
